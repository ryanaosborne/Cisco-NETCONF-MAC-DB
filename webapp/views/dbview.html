<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DB Inspector — PortFinder</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    background: #f1f5f9;
    color: #1e293b;
    min-height: 100vh;
  }

  .site-header {
    background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
    color: white;
    padding: 1.5rem 2rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  .site-header h1 { font-size: 1.4rem; font-weight: 700; margin: 0; }
  .site-header p  { color: #bfdbfe; margin: 0.25rem 0 0; font-size: 0.875rem; }
  .header-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .back-link {
    flex-shrink: 0;
    color: white;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    padding: 0.4rem 0.9rem;
    border-radius: 0.4rem;
    font-size: 0.8125rem;
    font-weight: 500;
    text-decoration: none;
    transition: background 0.15s;
  }
  .back-link:hover { background: rgba(255,255,255,0.25); }

  main { max-width: 1700px; margin: 0 auto; padding: 1.5rem 1rem; }

  .warn-banner {
    background: #fef3c7;
    border: 1px solid #f59e0b;
    color: #92400e;
    border-radius: 0.5rem;
    padding: 0.75rem 1rem;
    font-size: 0.875rem;
    font-weight: 500;
    margin-bottom: 1.25rem;
  }

  .card {
    background: white;
    border-radius: 0.75rem;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    overflow: hidden;
  }

  .card-toolbar {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 1.25rem;
    border-bottom: 1px solid #e2e8f0;
    background: #f8fafc;
    flex-wrap: wrap;
  }
  .toolbar-status { font-size: 0.8125rem; color: #64748b; display: flex; align-items: center; gap: 0.4rem; }
  .toolbar-ts { font-size: 0.75rem; color: #94a3b8; margin-left: auto; }

  .mini-spinner {
    width: 14px; height: 14px;
    border: 2px solid #e2e8f0;
    border-top-color: #3b82f6;
    border-radius: 50%;
    animation: spin 0.65s linear infinite;
    display: none;
  }
  .mini-spinner.active { display: inline-block; }

  /* Tabs */
  .tab-bar {
    display: flex;
    border-bottom: 1px solid #e2e8f0;
    padding: 0 0.75rem;
    gap: 0.125rem;
    flex-wrap: wrap;
  }
  .tab {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.7rem 0.875rem;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    font-size: 0.875rem;
    font-weight: 500;
    color: #64748b;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
    margin-bottom: -1px;
  }
  .tab:hover { color: #1e40af; }
  .tab.active { color: #1d4ed8; border-bottom-color: #1d4ed8; }

  .badge {
    background: #e2e8f0;
    color: #64748b;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 0.1rem 0.4rem;
    border-radius: 9999px;
    min-width: 1.4rem;
    text-align: center;
    transition: background 0.15s, color 0.15s;
  }
  .tab.active .badge { background: #dbeafe; color: #1d4ed8; }

  /* Search row */
  .search-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 1.25rem;
    border-bottom: 1px solid #f1f5f9;
    background: #fafbfc;
  }
  .search-input {
    flex: 1;
    max-width: 480px;
    border: 1px solid #cbd5e1;
    border-radius: 0.5rem;
    padding: 0.45rem 0.8rem;
    font-size: 0.875rem;
    color: #1e293b;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    background: white;
  }
  .search-input:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
  }
  .search-hint {
    font-size: 0.8rem;
    color: #94a3b8;
  }

  /* Panel */
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .panel-meta {
    font-size: 0.8rem;
    color: #64748b;
    padding: 0.6rem 1.25rem 0;
  }
  .panel-meta strong { color: #1e293b; }

  /* Status */
  .status-box { text-align: center; padding: 2.5rem 1rem; color: #64748b; font-size: 0.9rem; }
  .spinner {
    width: 28px; height: 28px;
    border: 3px solid #e2e8f0;
    border-top-color: #3b82f6;
    border-radius: 50%;
    animation: spin 0.65s linear infinite;
    margin: 0 auto 0.75rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-box {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #dc2626;
    border-radius: 0.5rem;
    padding: 0.875rem 1rem;
    font-size: 0.875rem;
    margin-bottom: 1rem;
  }

  /* Table */
  .table-outer { padding: 0 1.25rem 1rem; }
  .table-wrap-inner { overflow-x: auto; border-radius: 0.5rem; border: 1px solid #e2e8f0; }
  table { width: 100%; border-collapse: collapse; font-size: 0.815rem; white-space: nowrap; }
  thead th {
    background: #1e3a8a;
    color: white;
    padding: 0.575rem 0.875rem;
    text-align: left;
    font-weight: 500;
    font-size: 0.71rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  tbody tr { border-bottom: 1px solid #f1f5f9; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:nth-child(even) td { background: #fafbfc; }
  tbody tr:hover td { background: #f0f7ff !important; }
  td { padding: 0.475rem 0.875rem; vertical-align: middle; }
  td.desc { max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
  td.id-col { color: #94a3b8; font-size: 0.75rem; }

  code {
    background: #f1f5f9;
    border: 1px solid #e2e8f0;
    padding: 0.1rem 0.35rem;
    border-radius: 0.3rem;
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.78rem;
  }
  .null-val { color: #cbd5e1; }
  .bool-yes { color: #dc2626; font-weight: 600; }
  .bool-no  { color: #94a3b8; }

  /* Pagination */
  .pagination-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.25rem;
    padding: 0.75rem 1.25rem;
    border-top: 1px solid #f1f5f9;
  }
  .page-ellipsis {
    color: #94a3b8;
    padding: 0 0.125rem;
    font-size: 0.875rem;
    line-height: 1;
    user-select: none;
  }

  /* Buttons */
  button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.375rem;
    padding: 0.45rem 1rem;
    border-radius: 0.5rem;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    border: none;
    transition: background 0.15s, opacity 0.15s;
  }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary { background: #1d4ed8; color: white; }
  .btn-primary:hover:not(:disabled) { background: #1e40af; }

  .page-btn {
    padding: 0.3rem 0.6rem;
    border-radius: 0.375rem;
    font-size: 0.8rem;
    font-weight: 500;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    color: #475569;
    cursor: pointer;
    min-width: 2rem;
    transition: background 0.1s, border-color 0.1s, color 0.1s;
  }
  .page-btn:hover:not(:disabled) { background: #e2e8f0; border-color: #cbd5e1; }
  .page-btn.active { background: #1d4ed8; border-color: #1d4ed8; color: white; }
  .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-row">
    <div>
      <h1>DB Inspector</h1>
      <p>Raw PostgreSQL table viewer — troubleshooting use only</p>
    </div>
    <a class="back-link" href="/">← Back to PortFinder</a>
  </div>
</header>

<main>
  <div class="warn-banner">
    ⚠ This page exposes raw database contents. It is intended for troubleshooting only and should be disabled before production deployment.
  </div>

  <div id="global-error" class="error-box" hidden></div>

  <div class="card">
    <div class="card-toolbar">
      <button class="btn-primary" id="refresh-btn">↻ Refresh all</button>
      <span class="toolbar-status">
        <span class="mini-spinner" id="toolbar-spinner"></span>
        <span id="toolbar-msg"></span>
      </span>
      <span class="toolbar-ts" id="toolbar-ts"></span>
    </div>

    <div class="tab-bar" id="tab-bar">
      <button class="tab active" data-table="mac">MAC Table <span class="badge" id="badge-mac">—</span></button>
      <button class="tab" data-table="arp">ARP Table <span class="badge" id="badge-arp">—</span></button>
      <button class="tab" data-table="interface">Interfaces <span class="badge" id="badge-interface">—</span></button>
      <button class="tab" data-table="vlan">VLANs <span class="badge" id="badge-vlan">—</span></button>
    </div>

    <div class="tab-panel active" id="panel-mac">
      <div class="search-row">
        <input type="search" id="search-mac" class="search-input" placeholder="Search by MAC, node, interface, VLAN…" autocomplete="off">
        <span class="search-hint" id="search-hint-mac"></span>
      </div>
      <div id="status-mac" class="status-box"><div class="spinner"></div>Loading…</div>
      <div id="meta-mac" class="panel-meta" hidden></div>
      <div id="table-mac" class="table-outer" hidden></div>
      <div id="pagination-mac" hidden></div>
    </div>

    <div class="tab-panel" id="panel-arp">
      <div class="search-row">
        <input type="search" id="search-arp" class="search-input" placeholder="Search by IP, MAC, node, interface…" autocomplete="off">
        <span class="search-hint" id="search-hint-arp"></span>
      </div>
      <div id="status-arp" class="status-box"><div class="spinner"></div>Loading…</div>
      <div id="meta-arp" class="panel-meta" hidden></div>
      <div id="table-arp" class="table-outer" hidden></div>
      <div id="pagination-arp" hidden></div>
    </div>

    <div class="tab-panel" id="panel-interface">
      <div class="search-row">
        <input type="search" id="search-interface" class="search-input" placeholder="Search by name, node, IP, description, VRF…" autocomplete="off">
        <span class="search-hint" id="search-hint-interface"></span>
      </div>
      <div id="status-interface" class="status-box"><div class="spinner"></div>Loading…</div>
      <div id="meta-interface" class="panel-meta" hidden></div>
      <div id="table-interface" class="table-outer" hidden></div>
      <div id="pagination-interface" hidden></div>
    </div>

    <div class="tab-panel" id="panel-vlan">
      <div class="search-row">
        <input type="search" id="search-vlan" class="search-input" placeholder="Search by VLAN ID, name, node, status…" autocomplete="off">
        <span class="search-hint" id="search-hint-vlan"></span>
      </div>
      <div id="status-vlan" class="status-box"><div class="spinner"></div>Loading…</div>
      <div id="meta-vlan" class="panel-meta" hidden></div>
      <div id="table-vlan" class="table-outer" hidden></div>
      <div id="pagination-vlan" hidden></div>
    </div>
  </div>
</main>

<script>
const PAGE_SIZE = 100;

const TABLE_DEFS = {
  mac: {
    cols: [
      { key: 'id',           label: 'ID',           type: 'id' },
      { key: 'node_id',      label: 'Node ID' },
      { key: 'mac_address',  label: 'MAC Address',  type: 'code' },
      { key: 'interface',    label: 'Interface' },
      { key: 'vlan',         label: 'VLAN' },
      { key: 'mac_type',     label: 'Type' },
      { key: 'collected_at', label: 'Collected At',  type: 'ts' },
    ],
  },
  arp: {
    cols: [
      { key: 'id',           label: 'ID',           type: 'id' },
      { key: 'node_id',      label: 'Node ID' },
      { key: 'ip_address',   label: 'IP Address',   type: 'code' },
      { key: 'mac_address',  label: 'MAC Address',  type: 'code' },
      { key: 'interface',    label: 'Interface' },
      { key: 'age_seconds',  label: 'Age (s)' },
      { key: 'collected_at', label: 'Collected At',  type: 'ts' },
    ],
  },
  interface: {
    cols: [
      { key: 'id',           label: 'ID',           type: 'id' },
      { key: 'node_id',      label: 'Node ID' },
      { key: 'name',         label: 'Interface',    type: 'code' },
      { key: 'description',  label: 'Description',  type: 'desc' },
      { key: 'shutdown',     label: 'Shutdown',     type: 'bool' },
      { key: 'ip_address',   label: 'IP Address',   type: 'code' },
      { key: 'prefix_len',   label: 'Prefix' },
      { key: 'vrf',          label: 'VRF' },
      { key: 'mtu',          label: 'MTU' },
      { key: 'access_vlan',  label: 'Data VLAN' },
      { key: 'voice_vlan',   label: 'Voice VLAN' },
      { key: 'collected_at', label: 'Collected At',  type: 'ts' },
    ],
  },
  vlan: {
    cols: [
      { key: 'id',           label: 'ID',           type: 'id' },
      { key: 'node_id',      label: 'Node ID' },
      { key: 'vlan_id',      label: 'VLAN ID' },
      { key: 'name',         label: 'Name' },
      { key: 'status',       label: 'Status' },
      { key: 'collected_at', label: 'Collected At',  type: 'ts' },
    ],
  },
};

// Per-table state
const tableState = {};
Object.keys(TABLE_DEFS).forEach(key => {
  tableState[key] = { page: 1, query: '', total: 0, filteredTotal: 0, pages: 1, loading: false };
});

const debounceTimers = {};

function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderCell(v, type) {
  if (v === null || v === undefined) return '<span class="null-val">NULL</span>';
  switch (type) {
    case 'id':   return `<span style="color:#94a3b8;font-size:0.75rem">${esc(v)}</span>`;
    case 'code': return `<code>${esc(v)}</code>`;
    case 'desc': return esc(v);
    case 'ts': {
      const d = new Date(v);
      return `<span title="${esc(v)}">${d.toLocaleString()}</span>`;
    }
    case 'bool':
      return v ? '<span class="bool-yes">YES</span>' : '<span class="bool-no">no</span>';
    default:
      return esc(String(v));
  }
}

function buildTable(cols, rows) {
  const thead = `<thead><tr>${cols.map(c => `<th>${esc(c.label)}</th>`).join('')}</tr></thead>`;
  const tbody = rows.length === 0
    ? `<tbody><tr><td colspan="${cols.length}" style="text-align:center;color:#94a3b8;padding:2rem">No rows found</td></tr></tbody>`
    : `<tbody>${rows.map(row =>
        `<tr>${cols.map(c => {
          const extra = c.type === 'desc' ? ' class="desc"' : c.type === 'id' ? ' class="id-col"' : '';
          return `<td${extra}>${renderCell(row[c.key], c.type)}</td>`;
        }).join('')}</tr>`
      ).join('')}</tbody>`;
  return `<div class="table-wrap-inner"><table>${thead}${tbody}</table></div>`;
}

function buildPagination(key) {
  const s = tableState[key];
  if (s.pages <= 1) return '';

  const prevDis = s.page <= 1 ? ' disabled' : '';
  const nextDis = s.page >= s.pages ? ' disabled' : '';

  // Page number window (up to 7 buttons)
  const WINDOW = 7;
  const half = Math.floor(WINDOW / 2);
  let wStart = Math.max(1, s.page - half);
  let wEnd   = Math.min(s.pages, wStart + WINDOW - 1);
  wStart = Math.max(1, wEnd - WINDOW + 1);

  let nums = '';
  if (wStart > 1) nums += `<button class="page-btn" onclick="goPage('${key}',1)">1</button>`;
  if (wStart > 2) nums += `<span class="page-ellipsis">…</span>`;
  for (let i = wStart; i <= wEnd; i++) {
    const act = i === s.page ? ' active' : '';
    nums += `<button class="page-btn${act}" onclick="goPage('${key}',${i})">${i}</button>`;
  }
  if (wEnd < s.pages - 1) nums += `<span class="page-ellipsis">…</span>`;
  if (wEnd < s.pages) nums += `<button class="page-btn" onclick="goPage('${key}',${s.pages})">${s.pages}</button>`;

  return `<div class="pagination-bar">
    <button class="page-btn"${prevDis} onclick="goPage('${key}',${s.page - 1})">← Prev</button>
    ${nums}
    <button class="page-btn"${nextDis} onclick="goPage('${key}',${s.page + 1})">Next →</button>
  </div>`;
}

function goPage(key, page) {
  const s = tableState[key];
  if (page < 1 || page > s.pages) return;
  s.page = page;
  loadTable(key);
}

async function loadTable(key) {
  const s = tableState[key];
  if (s.loading) return;
  s.loading = true;

  const params = new URLSearchParams({ table: key, page: s.page, limit: PAGE_SIZE });
  if (s.query) params.set('q', s.query);

  const statusEl    = document.getElementById(`status-${key}`);
  const metaEl      = document.getElementById(`meta-${key}`);
  const tableEl     = document.getElementById(`table-${key}`);
  const paginEl     = document.getElementById(`pagination-${key}`);
  const hintEl      = document.getElementById(`search-hint-${key}`);
  const badgeEl     = document.getElementById(`badge-${key}`);

  statusEl.innerHTML = '<div class="spinner"></div>Loading…';
  statusEl.hidden = false;
  metaEl.hidden = true;
  tableEl.hidden = true;
  paginEl.hidden = true;

  try {
    const res = await fetch(`/api/db-inspect-table?${params}`);
    if (!res.ok) throw new Error((await res.text()) || `HTTP ${res.status}`);
    const data = await res.json();

    s.total         = data.total;
    s.filteredTotal = data.filtered_total;
    s.pages         = data.pages;

    // Badge: show filtered/total when searching, total otherwise
    if (s.query) {
      badgeEl.textContent = `${data.filtered_total.toLocaleString()} / ${data.total.toLocaleString()}`;
    } else {
      badgeEl.textContent = data.total.toLocaleString();
    }

    // Meta line
    const rows = data.rows ?? [];
    const pageStart = (s.page - 1) * PAGE_SIZE + 1;
    const pageEnd   = pageStart + rows.length - 1;
    let metaText = rows.length > 0
      ? `Rows <strong>${pageStart.toLocaleString()}–${pageEnd.toLocaleString()}</strong>`
      : `<strong>0</strong> rows`;
    if (s.query) {
      metaText += ` of <strong>${data.filtered_total.toLocaleString()}</strong> matching`;
      metaText += ` (${data.total.toLocaleString()} total) — page <strong>${s.page}</strong> of <strong>${s.pages}</strong>`;
      hintEl.textContent = `${data.filtered_total.toLocaleString()} match${data.filtered_total === 1 ? '' : 'es'}`;
    } else {
      metaText += ` of <strong>${data.total.toLocaleString()}</strong> total — page <strong>${s.page}</strong> of <strong>${s.pages}</strong>`;
      hintEl.textContent = '';
    }
    metaEl.innerHTML = metaText;
    metaEl.hidden = false;

    // Table
    const def = TABLE_DEFS[key];
    tableEl.innerHTML = buildTable(def.cols, rows);
    tableEl.hidden = false;

    // Pagination
    const paginHTML = buildPagination(key);
    if (paginHTML) {
      paginEl.innerHTML = paginHTML;
      paginEl.hidden = false;
    }

    statusEl.hidden = true;
  } catch (err) {
    statusEl.innerHTML = `<div style="color:#dc2626">Error loading ${key}: ${esc(err.message)}</div>`;
    statusEl.hidden = false;
    badgeEl.textContent = '!';
    hintEl.textContent = '';
  } finally {
    s.loading = false;
  }
}

async function loadAllTables() {
  const refreshBtn = document.getElementById('refresh-btn');
  const spinner    = document.getElementById('toolbar-spinner');
  const msg        = document.getElementById('toolbar-msg');
  const ts         = document.getElementById('toolbar-ts');

  refreshBtn.disabled = true;
  spinner.classList.add('active');
  msg.textContent = 'Loading…';

  // Reset to page 1 for all tables on full refresh
  Object.keys(TABLE_DEFS).forEach(key => { tableState[key].page = 1; });

  await Promise.all(Object.keys(TABLE_DEFS).map(key => loadTable(key)));

  const now = new Date();
  ts.textContent = `Last updated: ${now.toLocaleTimeString()}`;
  msg.textContent = '';
  refreshBtn.disabled = false;
  spinner.classList.remove('active');
}

// Search inputs — debounced 350 ms
Object.keys(TABLE_DEFS).forEach(key => {
  const input = document.getElementById(`search-${key}`);
  if (!input) return;
  input.addEventListener('input', () => {
    clearTimeout(debounceTimers[key]);
    debounceTimers[key] = setTimeout(() => {
      tableState[key].query = input.value.trim();
      tableState[key].page  = 1;
      loadTable(key);
    }, 350);
  });
});

// Tab switching
document.getElementById('tab-bar').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  const key = tab.dataset.table;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  tab.classList.add('active');
  document.getElementById(`panel-${key}`).classList.add('active');
});

document.getElementById('refresh-btn').addEventListener('click', loadAllTables);

loadAllTables();
</script>
</body>
</html>
