syntax = "proto3";
package mdt_dialout;
option go_package = "./proto";

// Top-level envelope Cisco sends for every MDT stream
message Telemetry {
  string   node_id_str          = 1;
  string   subscription_id_str  = 3;
  string   encoding_path        = 6;   // e.g. "Cisco-IOS-XE-arp-oper:arp-data/arp-vrf"
  uint64   collection_id        = 8;
  uint64   collection_start_time = 9;
  uint64   msg_timestamp        = 10;
  repeated TelemetryField data_gpbkv = 11;
}

message TelemetryField {
  uint64   timestamp    = 1;
  string   name         = 2;
  repeated TelemetryField fields = 15;

  oneof value_by_type {
    bytes    bytes_value  = 4;
    string   string_value = 5;
    bool     bool_value   = 6;
    uint32   uint32_value = 7;
    uint64   uint64_value = 8;
    sint32   sint32_value = 9;
    sint64   sint64_value = 10;
    double   double_value = 11;
    float    float_value  = 12;
  }
}

// IOS-XE outer wrapper — the serialized Telemetry is inside data.
message MdtDialoutArgs {
  int64 ReqId = 1;
  bytes data  = 2;
  string errors = 3;
}

message MdtDialoutResponse {
  string ReqId   = 1;
  int64  errors  = 2;
}

service gRPCMdtDialout {
  rpc MdtDialout(stream MdtDialoutArgs) returns (stream MdtDialoutResponse) {}
}