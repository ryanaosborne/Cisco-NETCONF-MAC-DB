services:
  redpanda:
    image: redpandadata/redpanda:v24.1.6
    container_name: redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - telemetry

  redpanda-setup:
    image: redpandadata/redpanda:v24.1.6
    container_name: redpanda-setup
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        rpk topic create arp-table interface-table mac-table vlan-table \
          --topic-config retention.ms=3600000 \
          --topic-config retention.bytes=268435456 \
          --topic-config segment.bytes=67108864 \
          --brokers redpanda:9092 2>/dev/null
        rpk topic alter-config arp-table interface-table mac-table vlan-table \
          --set retention.ms=3600000 \
          --set retention.bytes=268435456 \
          --set segment.bytes=67108864 \
          --brokers redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - telemetry
    restart: "no"

  postgres:
    image: postgres:16
    container_name: postgres
    entrypoint: ["/postgres-ssl-entrypoint.sh"]
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/tmp/pg-server.crt
      - -c
      - ssl_key_file=/tmp/pg-server.key
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./certs/postgres:/ssl:ro
      - ./postgres/ssl-entrypoint.sh:/postgres-ssl-entrypoint.sh:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "psql -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c 'SELECT 1 FROM mac_table LIMIT 1' && echo 'healthy' || echo 'not ready'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - telemetry

  # ---------------------------------------------------------------------------
  # Kafka UI — disabled by default. For troubleshooting only.
  #
  # To enable:
  #   1. Uncomment the kafka-ui service block below.
  #   2. Uncomment "- kafka-ui" in the nginx depends_on list below.
  #   3. Uncomment "- "8888:8888"" in the nginx ports list below.
  #   4. Uncomment the "listen 8888 ssl" server block in nginx/nginx.conf.
  #   5. Run: docker compose up -d kafka-ui nginx
  #
  # To disable again:
  #   1. Re-comment all four items above (reverse steps 1-4).
  #   2. Run: docker compose stop kafka-ui && docker compose up -d nginx
  # ---------------------------------------------------------------------------
  # kafka-ui:
  #   image: provectuslabs/kafka-ui:latest
  #   container_name: kafka-ui
  #   depends_on:
  #     redpanda:
  #       condition: service_healthy
  #   # Port not exposed to host — accessible only via nginx on port 8888
  #   environment:
  #     KAFKA_CLUSTERS_0_NAME: telemetry
  #     KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: redpanda:9092
  #   networks:
  #     - telemetry

  nginx:
    image: nginx:alpine
    container_name: nginx
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      # - kafka-ui   # uncomment when kafka-ui is enabled (step 2)
      - webapp
    ports:
      - "80:80"
      - "443:443"
      # - "8888:8888"   # uncomment when kafka-ui is enabled (step 3)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/nginx:/certs:ro
      - ./ext:/ext:ro
    networks:
      - telemetry

  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    container_name: collector
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "57400:57400"     # Cisco MDT default port
    environment:
      KAFKA_BROKER: redpanda:9092
      VLAN_DEBUG: ${VLAN_DEBUG:-false}
      INT_DEBUG: ${INT_DEBUG:-false}
      GRPC_GO_LOG_VERBOSITY_LEVEL: "0"
      GRPC_GO_LOG_SEVERITY_LEVEL: "error"
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - telemetry

  webapp:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    container_name: webapp
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    # Port not bound to host — accessible via nginx on port 443
    environment:
      POSTGRES_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=require
      SAML_ENABLED: ${SAML_ENABLED:-false}
      SAML_IDP_METADATA_URL: ${SAML_IDP_METADATA_URL:-}
      SAML_SP_ROOT_URL: ${SAML_SP_ROOT_URL:-}
      SAML_SP_CERT_FILE: /app/certs/saml/sp.crt
      SAML_SP_KEY_FILE: /app/certs/saml/sp.key
      SAML_ADMIN_ROLE: ${SAML_ADMIN_ROLE:-}
      DBVIEW_ENABLED: ${DBVIEW_ENABLED:-false}
      PA_FIREWALLS: ${PA_FIREWALLS:-}
      PA_TOKEN: ${PA_TOKEN:-}
      PA_TLS_SKIP_VERIFY: ${PA_TLS_SKIP_VERIFY:-false}
    volumes:
      - ./certs/saml:/app/certs/saml:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - telemetry

  consumer:
    build:
      context: .
      dockerfile: consumer/Dockerfile
    container_name: consumer
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      KAFKA_BROKER: redpanda:9092
      POSTGRES_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=require
      DATA_TTL_DYNAMIC: ${DATA_TTL_DYNAMIC:-1h}
      DATA_TTL_STATIC: ${DATA_TTL_STATIC:-24h}
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - telemetry

volumes:
  redpanda-data:
  postgres-data:

networks:
  telemetry:
    driver: bridge