# TYPE    DATABASE  USER  ADDRESS          METHOD
# Local socket connections (used by Docker init scripts)
local     all       all                    trust
# Localhost TCP (health checks, same-host tools)
host      all       all   127.0.0.1/32     scram-sha-256
host      all       all   ::1/128          scram-sha-256
# All other TCP connections must use SSL
hostssl   all       all   0.0.0.0/0        scram-sha-256
